name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-verification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev build-essential

    - name: Install pip packages
      run: |
        pip install --upgrade pip
        pip install -r backend/app/requirements.txt
        pip install sentence-transformers faiss-cpu flake8

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run all Python Unit & Integration Tests
      run: |
        python -m unittest discover -s tests

  node-verification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Node packages
      run: |
        cd frontend
        npm ci

    - name: Build frontend assets
      run: |
        cd frontend
        npm run build

  docker-verification:
    runs-on: ubuntu-latest
    needs: [python-verification, node-verification]
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Container
      run: |
        docker build -t lakehouse-app:latest -f Dockerfile .
