version: '3.8'

services:
  # ----------------------------------------------------
  # PostgreSQL: Relational Storage & Backend Database
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: lakehouse-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: betting_lakehouse
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ----------------------------------------------------
  # Kafka: Event Broker for Scraper Event Streams
  # ----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-kraft
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka

  # ----------------------------------------------------
  # MinIO: S3-Compatible Storage for Bronze Data
  # ----------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: lakehouse-minio
    ports:
      - "9005:9000"  # MinIO API Port
      - "9006:9001"  # MinIO Console Port
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------
  # Nessie: Iceberg Catalog Server for Table Management
  # ----------------------------------------------------
  nessie:
    image: projectnessie/nessie:0.73.0
    container_name: lakehouse-nessie
    ports:
      - "19120:19120"
    environment:
      - NESSIE_SERVER_CFG_REST_SECURE=false

  # ----------------------------------------------------
  # Prometheus: Metrics Monitoring Collector
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: lakehouse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ----------------------------------------------------
  # Grafana: Monitoring & KPI Dashboard
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:10.0.3
    container_name: lakehouse-grafana
    ports:
      - "3001:3000"  # Map to 3001 to prevent conflicts on standard 3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards

  # ----------------------------------------------------
  # App: Unified FastAPI Backend & React Frontend
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lakehouse-app
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/betting_lakehouse
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=minio:9000
      - NESSIE_URI=http://nessie:19120/api/v1
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - db
      - kafka
      - minio
      - nessie
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:
